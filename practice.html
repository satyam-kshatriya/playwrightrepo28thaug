<!doctype html>
<html>
  <head>
    <title>API Mock Practice</title>
  </head>

  <body>
    <h1>Posts</h1>

    <div id="result"></div>

    <script>
      fetch("https://jsonplaceholder.typicode.com/posts/1")
        .then((response) => response.json())
        .then((data) => {
          if (!data || !data.title) {
            document.getElementById("result").innerText = "No data found";
          } else {
            document.getElementById("result").innerText = data.title;
          }
        });
    </script>
  </body>
</html>
